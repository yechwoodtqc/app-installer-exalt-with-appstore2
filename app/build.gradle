plugins {
    id 'com.android.application'
}

def storeApiBaseUrl = System.getenv('STORE_API_BASE_URL') ?: 'https://yw-app-store-api.yw-app-installer-store-2026.workers.dev'

android {
    namespace 'com.lge.lginstallservie'
    compileSdk 35

    defaultConfig {
        applicationId 'com.lge.lginstallservie'
        minSdk 23
        targetSdk 23
        versionCode 8
        versionName '1.7'
        buildConfigField 'String', 'STORE_API_BASE_URL', "\"\${storeApiBaseUrl}\""
    }

    buildFeatures {
        buildConfig true
    }
}
