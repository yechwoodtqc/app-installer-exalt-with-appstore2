name: Publish Store Catalog

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate store settings
        env:
          STORE_API_BASE_URL: ${{ vars.STORE_API_BASE_URL }}
          STORE_ADMIN_SECRET: ${{ secrets.STORE_ADMIN_SECRET }}
        run: |
          test -n "$STORE_API_BASE_URL" || (echo "Missing repository variable STORE_API_BASE_URL" && exit 1)
          test -n "$STORE_ADMIN_SECRET" || (echo "Missing repository secret STORE_ADMIN_SECRET" && exit 1)
          case "$STORE_API_BASE_URL" in https://*) ;; *) echo "STORE_API_BASE_URL must use HTTPS"; exit 1 ;; esac
      - name: Publish each catalog entry without removing other apps
        env:
          STORE_API_BASE_URL: ${{ vars.STORE_API_BASE_URL }}
          STORE_ADMIN_SECRET: ${{ secrets.STORE_ADMIN_SECRET }}
        run: |
          set -euo pipefail
          API="${STORE_API_BASE_URL%/}"
          jq -c '.apps[]' catalog/apps.json | while IFS= read -r app; do
            echo "Publishing $(printf '%s' "$app" | jq -r '.name')"
            curl --fail-with-body --silent --show-error \
              -X POST "$API/admin/apps/upsert" \
              -H "Authorization: Bearer $STORE_ADMIN_SECRET" \
              -H "Content-Type: application/json" \
              --data "$app"
            echo
          done
